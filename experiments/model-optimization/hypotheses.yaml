- id: A5-sys_batched_restarts
  agent: agent5 (systems)
  name: sys_batched_restarts
  mechanism: 'Run the B restarts of one (setting, arm, n) cell as one batch: x is (B, d); the unconditional denoiser,
    the CM sampler (B*M*n rows), the per-set MMDs and the element-wise Adam moments are all row-separable; per-(restart,
    t, j) conditional noise is pre-drawn from the same key_seed seeds with a torch.Generator; diverged rows are
    masked out. Implemented in systems/runners.py::run_batched_restarts. exactness: REORDER'
  expected_benefit: CPU throughput 5 -> 35-90 restarts/s (7-25x) at n=8, saturating ~25-30 r/s at n=32 on 4 threads
    (systems/BENCH.md). Same conditional-call count; no memory change.
  possible_bias: 'None in expectation: rows never interact. Float32 reduction order changes above ~32 rows (BLAS
    kernel choice), so individual restarts can land in a different mode than the sequential run (end-to-end |dx|
    up to O(1) on a few restarts) even though per-step gradients agree to <= 2e-4 abs. Divergence masking must freeze
    rows exactly when the sequential loop would break.'
  affected_tasks: synthetic_2D, synthetic_5D, synthetic_10D, MNIST(seeds), SD(variations/seeds)
  primary_metric: restarts_per_s at equal cond_samples; L2 mean/median/success_rate over restarts
  compute_budget: ''
  rejection_criterion: teacher-forced per-step gradient max-abs diff > 1e-3, or paired L2 distribution over >= 20
    restarts differs from sequential at perm_p < 0.05 in either direction, or per-restart cost does not fall by
    >= 3x at B >= 8.
  verdict: conditional
  verification: verifier-confirmed (VERIFICATION.md)
  evidence: '~10x throughput at B>=8 (verifier: B=8 4-15x per restart on a loaded Mac; implementer 14-25x at B=32)
    but per-step gradient jumps up to 2.7e-3 abs = 8% rel at ReLU-boundary steps (verifier) -- statistical equivalence
    only; report batched runs as re-runs, not reproductions (VERIFICATION.md 4.2).'
  source_files: hypotheses/agent5.yaml; systems/AUDIT.md; systems/BENCH.md
- id: A5-sys_mmd_blocks_cached_yy
  agent: agent5 (systems)
  name: sys_mmd_blocks_cached_yy
  mechanism: 'Replace LossFunctions.MMDLoss''s (n+m)^2 stacked kernel by XX (n x n) and XY (n x m) blocks with the
    target-target block YY computed once per run (it is a constant, carries no gradient, and is 94% of the kernel
    entries at n=8); optionally batched over the M perturbation sets with one cdist call (systems/runners.py::BatchedMMD).
    exactness: REORDER'
  expected_benefit: MMD forward 460 us -> 92 us at n=8; whole-loop 1.5x (no_lgd) to 4.5x (lgd) per restart.
  possible_bias: None; kernel entries are bit-identical, only .mean() summation order differs (per-step grad diff
    <= 1.3e-6).
  affected_tasks: synthetic_all, MNIST, SD
  primary_metric: wall_s per restart; per-step gradient max-abs diff
  compute_budget: ''
  rejection_criterion: per-step gradient max-abs diff > 1e-5 (float32) or L2 distribution shift at perm_p < 0.05.
  verdict: promoted
  verification: verifier-confirmed (VERIFICATION.md)
  evidence: Per-step teacher-forced |dg| ~1e-6 (REORDER), 1.5x (no-LGD) to 4.5x (LGD) per restart (systems/BENCH.md;
    verifier check_systems.log). Same mechanism as A2-fixed_target_cache.
  source_files: hypotheses/agent5.yaml; systems/AUDIT.md; systems/BENCH.md
