model_name: "stabilityai/sdxl-turbo"
data_dir: "./scribble_tune/data/quickdraw_512"
output_dir: "./scribble_tune/output"
resolution: 512
lora_rank: 4
lora_alpha: 4
learning_rate: 1.0e-4
lr_scheduler: "cosine"
train_batch_size: 16
gradient_accumulation_steps: 1
num_epochs: 3
mixed_precision: "fp16"
checkpointing_steps: 5000
max_grad_norm: 1.0
seed: 42
caption: "a simple hand-drawn scribble"

# QuickDraw data preparation
# categories: "all" uses all 345 QuickDraw categories; or provide a list to subset
categories: "all"
samples_per_category: 1000  # per category; 345 categories x 1000 = ~345K images
