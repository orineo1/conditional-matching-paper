  compute_budget: '0'
  rejection_criterion: already met for the approximation question
  verdict: rejected
  verification: implementer-reported, not independently verified
  evidence: 'Different objective, not an MMD approximation: cos 0.3-0.9 (d<=16), ~0.1 at d=768 with P=32 (approx_loss/DIAGNOSTICS.md).
