# Merged hypotheses of the CDM performance campaign (Agent 7). One entry per pre-registered
# candidate; verdicts: promoted / conditional / rejected / not-run. 'verification' says whether the
# verdict rests on Agent 6's independent checks (VERIFICATION.md) or only on the implementer's numbers.
# Generated by report_tools/merge_hypotheses.py from hypotheses/agent{1..5}.yaml.
commit: 6af2081
hypotheses:
- id: A1-cache_target_target_kernel_and_split_blocks
  agent: agent1 (baseline/profiler)
  name: cache_target_target_kernel_and_split_blocks
  mechanism: MMDLoss stacks (X;Y) and computes cdist/exp on the full (n+m)^2 x 5 matrix every evaluation, then slices.
    Precompute K_YY.mean() once per run (S_G and bandwidth are frozen and detached) and compute only K_XX (n x n)
    and K_XY (n x m). Removes 79-94% of kernel entries from BOTH forward and backward; autograd no longer differentiates
    through EuclideanDist/Exp on the m x m block.
  expected_benefit: 'Micro-benchmark (2D, m=250): MMD fwd+bwd 1.22 ms -> 0.18 ms at n=8, 1.51 -> 0.40 ms at n=32;
    ~45-50% of no-LGD wall per step (~1.9-2.2 ms/step), ~55% of LGD wall. Identical conditional_calls.'
  possible_bias: None in exact arithmetic; float32 summation order differs (observed |delta| ~7e-7 on MMD ~0.1-0.3).
    Trajectories may diverge bit-wise, so equivalence must be shown at the metric level (paired L2 over restarts)
    as well as per-step gradient tolerance.
  affected_tasks: synthetic_2D, synthetic_5D, synthetic_10D, SD (K_yy block of compute_mmd), MNIST n/a (SWD)
  primary_metric: wall_s per run and per-step gradient max-abs error vs baseline; exact L2 paired
  compute_budget: ''
  rejection_criterion: per-step gradient max-abs error > 1e-5 (relative 1e-4) on 2D n=8 restarts 0..4, or paired
    exact-L2 difference 95% CI excludes 0 over 100 restarts, or wall saving < 20%.
  verdict: promoted
  verification: verifier-confirmed (VERIFICATION.md)
  evidence: 'Same mechanism as A2-fixed_target_cache / A5-sys_mmd_blocks_cached_yy. Verifier: exact to 1.3e-14 (float64),
    4.6-7.0x on the MMD fwd+bwd, 1.6-2.6x per restart (VERIFICATION.md 4.1; profiling/baseline_profile.md: YY block
    = 94% of kernel entries at n=8).'
  source_files: hypotheses/agent1.yaml; profiling/baseline_profile.md
- id: A1-batch_lgd_perturbations_into_one_sampler_call
  agent: agent1 (baseline/profiler)
  name: batch_lgd_perturbations_into_one_sampler_call
  mechanism: _guided.run runs M_t = 3 perturbations as three separate model_cond.sample calls of n, three kernels
    and three graph branches. Stack the 3 conditions into one (3n) sampler call (the CM forward is per-row independent),
    compute three n x m / n x n blocks from one batched forward, keep the -logsumexp aggregation unchanged (no pooling
    into one MMD).
  expected_benefit: CM forward is per-call-overhead bound (n=8 -> n=32 costs +10%), so 3 calls -> 1 call removes
    ~2/3 of the cond_sample bucket (20% of LGD wall) and 2/3 of the kernel/backward graph nodes; LGD from ~2.7x
    to ~1.4x the no-LGD wall at equal conditional_calls.
  possible_bias: RNG stream changes (one torch.randn of 3n vs three seeded draws) unless the per-j seeds are reproduced
    by drawing separately and concatenating; the estimator is otherwise identical. Verify by keeping per-j draws
    and only batching the network forward.
  affected_tasks: synthetic_* (lgd arms), MNIST (num_x_t = 3, same pattern)
  primary_metric: wall_s at fixed conditional_calls; per-step gradient equality when draws are preserved
  compute_budget: ''
  rejection_criterion: gradient differs (> 1e-5) with preserved draws, or wall saving < 25% on lgd cells
  verdict: promoted
  verification: verifier-confirmed (VERIFICATION.md)
  evidence: '= A5-sys_batched_lgd_perturbations: EXACT (0.0 end-to-end, verifier check_systems.log), 0.74->0.54
    s on LGD n=8 (systems/BENCH.md).'
  source_files: hypotheses/agent1.yaml; profiling/baseline_profile.md
- id: A1-freeze_parameters_and_trim_autograd_graph
  agent: agent1 (baseline/profiler)
  name: freeze_parameters_and_trim_autograd_graph
  mechanism: Both models keep requires_grad=True on all parameters; torch.autograd.grad(loss, x) never needs weight
    grads but the graph saves inputs for them and builds AccumulateGrad nodes on every Linear (4554 addmm per run).
    Set requires_grad_(False) on model parameters (and consider torch.inference-free functional forward), remove
    sample_ddim_step's per-call self.to(device)/dtype query, cache the time embedding for the 100 (resp. 5) t values.
  expected_benefit: Backward bucket is 42-46% and 'other' 8-11% of wall; expected 10-20% wall reduction (graph construction
    + backward node count), zero change to numerics.
  possible_bias: none (bit-identical expected)
  affected_tasks: synthetic_*, MNIST (UNet/CM params), SD (already frozen)
  primary_metric: wall_s; bit-identical x_hat
  compute_budget: ''
  rejection_criterion: x_hat not bit-identical on 2D restarts 0..4, or wall saving < 5%
  verdict: conditional
  verification: verifier-confirmed (VERIFICATION.md)
  evidence: 'requires_grad_(False): EXACT (0.0) but ~0% wall on the synthetic MLPs (systems/BENCH.md; verifier confirmed
    exactness). Keep as hygiene; the predicted 10-20% did not materialise. Lean DDIM step / cached time embedding:
    +1-5% (A5-sys_lean_ddim_step).'
  source_files: hypotheses/agent1.yaml; profiling/baseline_profile.md
- id: A1-reduce_per_step_framework_overhead (fuse kernel ops / compile)
  agent: agent1 (baseline/profiler)
  name: reduce_per_step_framework_overhead (fuse kernel ops / compile)
  mechanism: 'Wall is flat in n and in dim(X): ~100 small aten ops per step dominate. Fuse the kernel (div/neg/exp/sum
    over 5 bandwidths) into one expression or torch.compile the kernel+MMD function and the CM ladder; avoid global
    torch.manual_seed per step by using a torch.Generator.'
  expected_benefit: '15-30% wall on no-LGD cells (op count, allocation: div/neg/mul/exp allocate ~850 MB cumulative
    per run)'
  possible_bias: torch.compile may change float32 reduction order (same tolerance regime as hypothesis 1)
  affected_tasks: synthetic_*
  primary_metric: wall_s, per-step gradient tolerance
  compute_budget: ''
  rejection_criterion: gradient max-abs error > 1e-5 or wall saving < 10%
  verdict: rejected
  verification: implementer-reported, not independently verified
  evidence: 'torch.compile: 0.84x steady state +16 s compile on the loop (systems/BENCH.md); on the MMD alone 1.4-2.5x
    steady state but 2-7 s compile per shape and 26k-58k-call break-even (exact_loss/REPORT.md 4). The torch.Generator
    part is promoted as A5-sys_generator_seeding (EXACT).'
  source_files: hypotheses/agent1.yaml; profiling/baseline_profile.md
- id: A1-sd_remove_non_guidance_sprinter_work
  agent: agent1 (baseline/profiler)
  name: sd_remove_non_guidance_sprinter_work
  mechanism: In run_mlgd_f.py every guided step also runs visualize_step (5 sprinter pipeline calls, 4 VAE decodes,
    PCA), a second architect UNet pass for the unguided control trajectory, sprinter.vae fp16<->fp32 casts, CLIP
    CPU<->GPU moves around eval, and per-call prompt re-encoding with variation_batch_size=1. Make visualisation/eval
    opt-in or every k steps, batch the 6 variations where memory allows, cache prompt embeddings, keep VAE dtype
    fixed, cache K_yy.
  expected_benefit: Roughly 5 of 11 sprinter forward passes per step are diagnostics (~45% of sprinter forwards,
    ~30% of step wall excluding backward); plus one UNet CFG pass. Expected 30-45% wall per step with identical
    guided trajectory.
  possible_bias: none for the guided trajectory if RNG consumption by diagnostic calls is reproduced (diagnostic
    sprinter calls consume CUDA RNG state, so bit-identity needs a separate generator)
  affected_tasks: SD
  primary_metric: wall_s per guided step; guided MMD trajectory identical when generators are separated
  compute_budget: ''
  rejection_criterion: guided trajectory changes beyond fp16 noise when diagnostics are disabled with RNG isolation,
    or saving < 20%
  verdict: not-run
  verification: not run (static analysis only)
  evidence: 'Static: 5 of 11 sprinter forwards per step are visualisation, second CFG UNet pass, VAE dtype casts,
    CLIP CPU<->GPU moves (profiling/baseline_profile.md 4c; systems/AUDIT.md 3). Estimated 25-45% wall/step; no
    SD run in this campaign.'
  source_files: hypotheses/agent1.yaml; profiling/baseline_profile.md
- id: A1-mnist_cache_image_encoder_and_fix_target_set
  agent: agent1 (baseline/profiler)
  name: mnist_cache_image_encoder_and_fix_target_set
  mechanism: CircularAngleConsistencyModel.forward re-runs the conv image encoder on the same batch-1 condition
    at each of the 5 ladder levels (15x per step) and the loop resamples the 1500 target angles and 50 SWD projections
    every evaluation; autograd.grad uses retain_graph=True. Encode the condition once per sampler call, draw the
    target set once per run (as the synthetic loop does), drop retain_graph.
  expected_benefit: Removes 12 of 15 encoder passes per step (the encoder is the only conv net in f_phi) and the
    retained graph memory; fixed targets/projections reduce gradient variance at zero cost (a change of estimator,
    to be evaluated as such).
  possible_bias: Fixed target set / projections changes the estimator (lower variance, possible bias toward the
    particular draw) -- must be evaluated on the angle-distribution metric, not assumed equivalent; encoder caching
    is exact.
  affected_tasks: MNIST
  primary_metric: wall_s and peak GPU memory per seed; final SWD and digit-angle histogram
  compute_budget: ''
  rejection_criterion: final-SWD paired difference worse at p < 0.05 over 15 seeds, or wall saving < 15%
  verdict: not-run
  verification: not run (static analysis only)
  evidence: 'Static: image encoder recomputed 5x per sampler call (15x/step), targets + SWD projections resampled
    per call, retain_graph=True (profiling/baseline_profile.md 4b; systems/AUDIT.md 2). Fixed targets/projections
    is an estimator change -- would need its own screen.'
  source_files: hypotheses/agent1.yaml; profiling/baseline_profile.md
- id: A2-fixed_target_cache
  agent: agent2 (exact loss)
  name: fixed_target_cache
  mechanism: Cache the target Y, ||y||^2, the Y-Y squared distances and the scalar YY kernel mean once (Y = S_G
    is constant across all diffusion steps and restarts); per call evaluate only the XX (n x n) and XY (n x m) kernel
    blocks instead of the stacked (n+m) x (n+m) matrix whose YY block (m x m = 62,500 of 66,564 entries for n=8,
    m=250) the reference recomputes, including through autograd.
  expected_benefit: 'Work drops from 5*(n+m)^2 to 5*(n^2 + n*m) exps: ~30x fewer kernel evaluations at n=8, m=250;
    ~4x at n=100, m=250. Measured 3-14x wall-time speedup at n<=8, m=250 (CPU float64), see bench_summary.md.'
  possible_bias: none, exact (same value and dL/dX to ~1e-15 relative in float64; adaptive-bandwidth rule reproduced
    on the stacked statistic incl. gradient)
  affected_tasks: synthetic Exp2-7 (_guided.py), SD pipeline compute_mmd, any TFG/CDM loop with a fixed target
  primary_metric: forward+backward wall time of one MMD evaluation; fraction of step time
  compute_budget: ''
  rejection_criterion: any loss/gradient mismatch > 1e-12 (float64) vs reference, or < 1.2x speedup in the n<=32,
    m=250 regime
  verdict: promoted
  verification: verifier-confirmed (VERIFICATION.md)
  evidence: 'Verifier: value + dX gradient <= 1.3e-14 relative vs LossFunctions.MMDLoss over 7 (n,m,d) x 2 seeds,
    fixed and adaptive bw; 236 author tests pass; n=8: 1.96 -> 0.42 ms (4.6x); end-to-end 1.66-1.93x (exact_loss/end_to_end_results.csv).
    float32: reorder-only, trajectories move up to 0.18 (chaos, not error).'
  source_files: hypotheses/agent2.yaml; exact_loss/REPORT.md
- id: A2-fixed_target_mm
  agent: agent2 (exact loss)
  name: fixed_target_mm
  mechanism: Squared distances as ||x||^2 + ||y||^2 - 2 x y^T (clamp >= 0) with cached ||y||^2, instead of torch.cdist(.)^2
    (sqrt then square, with its own backward kernel). torch.cdist already switches to the matmul formula for > 25
    rows, so the reference at m=250 is matmul-based anyway.
  expected_benefit: small constant factor (avoids sqrt/square round trip and the cdist backward); mostly matters
    at d=768
  possible_bias: none, exact (clamp only acts on rounding-negative entries whose true value is 0; gradient there
    is 0 in both formulas)
  affected_tasks: same as above
  primary_metric: wall time
  compute_budget: ''
  rejection_criterion: mismatch > 1e-12 in float64 or no speedup over fixed_target_cache
  verdict: promoted
  verification: verifier-confirmed (VERIFICATION.md)
  evidence: Covered by the verifier's cdist/mm x exp/powchain/loop grid (<= 1.3e-14). 6.3x (f32) / 10.2x (f64) geometric-mean
    micro-benchmark speedup vs reference (exact_loss/bench_summary_small.md).
  source_files: hypotheses/agent2.yaml; exact_loss/REPORT.md
- id: A2-powchain_kernel
  agent: agent2 (exact loss)
  name: powchain_kernel
  mechanism: 'With multipliers 2^(k-2) the 5 RBF kernels are integer powers of one base: E = exp(-D/(4 bw)), K =
    E + E^2 + E^4 + E^8 + E^16. One exp + 4 squarings replaces 5 exps over the block; backward is through mul instead
    of exp.'
  expected_benefit: ~2x less transcendental work in the kernel stage; measured 1.2-1.6x on top of fixed_target_mm
    for d<=10, negligible at d=768 where the matmul dominates.
  possible_bias: none, exact (few-ulp reordering; identical underflow behaviour)
  affected_tasks: synthetic Exp2-7, any repo-kernel MMD with integer mul_factor and alpha=1
  primary_metric: wall time
  compute_budget: ''
  rejection_criterion: mismatch > 1e-12 vs reference or slower than "exp" evaluation
  verdict: promoted
  verification: verifier-confirmed (VERIFICATION.md)
  evidence: 'Exact (few ulp; verifier grid). fixed_mm_powchain: 0.28 ms at n=8 (7.0x, verifier), best end-to-end
    variant 1.77-2.02x (exact_loss/end_to_end_results.csv).'
  source_files: hypotheses/agent2.yaml; exact_loss/REPORT.md
- id: A2-chunked_fused_xy
  agent: agent2 (exact loss)
  name: chunked_fused_xy
  mechanism: Blockwise XY kernel sum over Y with an autograd.Function that computes the value, dS/dX and dS/d(scales)
    inside the forward and stores only (n, d) + (K,); no (5, n, m) tensor is kept for backward. Adaptive bandwidth
    supported via a closed-form sum of XY squared distances.
  expected_benefit: peak memory O(n d + chunk n) instead of O(5 n m); speed neutral to slightly slower (Python loop
    over chunks). Only relevant for very large m (>> 2000) or on memory-limited GPUs.
  possible_bias: none, exact to first order (gradcheck passes); not differentiable twice (create_graph through it
    gives no second derivative)
  affected_tasks: large-target settings only
  primary_metric: peak memory; wall time
  compute_budget: ''
  rejection_criterion: mismatch > 1e-12 or > 1.5x slower than fixed_target_mm at m<=2000
  verdict: conditional
  verification: verifier-confirmed (VERIFICATION.md)
  evidence: Exact to first order (verifier chunk 64/7 check <= 1.3e-14; gradcheck). Speed-neutral, memory only --
    not needed at m=250; relevant for m >> 2000 on a memory-limited GPU (exact_loss/REPORT.md).
  source_files: hypotheses/agent2.yaml; exact_loss/REPORT.md
- id: A2-batched_sets
  agent: agent2 (exact loss)
  name: batched_sets
  mechanism: Evaluate B independent sample sets (B, n, d) against the same Y in one batched call (bmm / broadcast),
    returning (B,) losses -- for LGD/TFG's M perturbations and for independent restarts evaluated together.
  expected_benefit: amortises Python/dispatch overhead; ~B x fewer kernel launches. Measured 2-3x vs B reference
    calls for small n. Requires the caller to concatenate the M sampler outputs before the loss (the loss itself
    is tiny; the real win would come from batching the sampler too, which is Agent 4/5 scope).
  possible_bias: none, exact (each element equals the single-set loss)
  affected_tasks: _guided.py with spatial M>1, restart loops
  primary_metric: wall time per B losses
  compute_budget: ''
  rejection_criterion: any element differs from the single-set loss by > 1e-12
  verdict: conditional
  verification: verifier-confirmed (VERIFICATION.md)
  evidence: Exact (== B reference calls, verifier batched() check). 12.6x f32 vs 3 reference calls but only ~2x
    over 3 fixed_mm calls; useful only once the M=3 sampler outputs are concatenated (A5 batched LGD).
  source_files: hypotheses/agent2.yaml; exact_loss/REPORT.md
- id: A2-torch_compile_powchain
  agent: agent2 (exact loss)
  name: torch_compile_powchain
  mechanism: torch.compile(dynamic=False) of the best eager variant (fixed_mm_powchain)
  expected_benefit: fuse the elementwise kernel stage; reported as compile overhead vs steady state separately in
    bench_summary.md
  possible_bias: none, exact (same graph), but recompiles per shape (n_t varies per step)
  affected_tasks: synthetic loop if n_t is constant
  primary_metric: steady-state wall time; first-call (compile) time
  compute_budget: ''
  rejection_criterion: compile time not amortised within one experiment, or steady-state speedup < 1.2x over eager
  verdict: rejected
  verification: implementer-reported, not independently verified
  evidence: Steady state 1.4-2.5x over eager, exact, but 2-7 s compile per shape (dynamic=False; n_t and dtype are
    shapes), break-even 26k-58k calls vs 99-297 per restart; inductor hung 9/12 attempts on macOS (exact_loss/bench_compile_cpu.md).
  source_files: hypotheses/agent2.yaml; exact_loss/REPORT.md
- id: A3-pop-gmm-target
  agent: agent3 (approximate loss)
  name: A3-pop-gmm-target
  mechanism: Replace the empirical cross term mean_i mean_j K(x_i, y_j) against the m=250-sample target S_G by the
    closed-form kernel mean embedding of the population GMM target (tfg.gmm_mmd.kernel_mean_embedding_multibandwidth),
    and the constant YY term by E_{y,y'~G} K. Exact semi-population MMD^2(P_X, G); cost O(n^2 + n K) instead of
    O(n^2 + n m). Deterministic, no features, no seeds. Same 5-bandwidth kernel and frozen bandwidth as the repo.
  expected_benefit: Per-call loss cost 0.02-0.12x (d=1, K=2) and 0.2-0.55x (d=8,16, K<=11) of the exact-cached loss;
    removes the O(1/sqrt m) target-sampling noise from the objective (the minimiser is x* exactly). Measured gradient
    cosine to the empirical-target gradient 0.989-0.998; wall-clock gain is bounded by the loss share of a step
    (conditional model dominates), so the primary benefit is a cleaner objective at lower cost, not a large speed-up.
  possible_bias: Changes the objective from MMD^2(P_X, S_G) to MMD^2(P_X, G) (rel. difference 1-5% in value). Only
    applicable when the target is given parametrically (synthetic 2D/5D/10D, dimy benchmark, MNIST angular GMM);
    not SD. Must not be used for the EVALUATION metric (keep |x - x*| / L2).
  affected_tasks: synthetic_2D, synthetic_5D, synthetic_10D, dimy_scaling, mnist_angles
  primary_metric: penalised |x - x*| (synthetic) at equal conditional-model calls; secondary loss wall/step
  compute_budget: exp2-style run, 50 restarts x n in {4,8,16,32}, 2D + dimy d in {1,8,16}; CPU minutes
  rejection_criterion: Paired L2 vs exact-empirical baseline worse (perm p<0.05, mean_diff<0) at any n, or no measurable
    reduction in loss wall share; also reject if Agent 1's profile shows the loss is <5% of step time (then it is
    a cleanliness change only and goes to Agent 4's estimator track).
  verdict: not-run
  verification: implementer-reported, not independently verified
  evidence: 'Diagnostics only (approx_loss/REPORT.md): gradient cosine 0.989-0.998 to the empirical-target gradient,
    cost 0.02-0.12x (d=1) / 0.2-0.55x (d=8,16) of the cached-exact loss, deterministic. Stage-1 screen proposed,
    never run; also a change of objective (population vs S_G target), synthetic/MNIST only.'
  source_files: hypotheses/agent3.yaml; approx_loss/REPORT.md
- id: A3-subsample-target-fixed
  agent: agent3 (approximate loss)
  name: A3-subsample-target-fixed
  mechanism: Exact XX term, cross term against a FIXED random subset of B<m targets (common random numbers across
    the trajectory), YY constant from the full target. Equivalent to running the repository loss with a smaller
    target set.
  expected_benefit: Cost 0.28-0.34x at B=64 (m=250); gradient cosine 0.96-0.98 (d=1..16, B=64), grad-norm error
    4-13%. Quantifies how much of m=250 the gradient actually uses.
  possible_bias: O(1/sqrt B) target-sampling bias per trajectory (fixed subset) or added per-step variance (fresh
    subset). At d=768, m=120 subsampling to 64 already degrades cosine to 0.74 -- do not use for SD.
  affected_tasks: synthetic_2D, dimy_scaling
  primary_metric: penalised |x - x*| vs B, at fixed n
  compute_budget: one exp2-style sweep B in {32,64,125,250}, 50 restarts; CPU minutes
  rejection_criterion: L2 degrades (perm p<0.05) at B<=125, or Agent 1 shows the loss share is negligible.
  verdict: not-run
  verification: implementer-reported, not independently verified
  evidence: Cost 0.28-0.34x at B=64, grad cos 0.96-0.98 (d<=16), 0.74 at d=768 (approx_loss/DIAGNOSTICS.md). Documented
    as a cost-accuracy knob only; no L2 screen run.
  source_files: hypotheses/agent3.yaml; approx_loss/REPORT.md
