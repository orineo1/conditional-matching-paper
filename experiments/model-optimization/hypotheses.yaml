  mechanism: 'Evaluate the M=3 LGD perturbations as one CM call on 3n rows; the per-perturbation RNG (manual_seed(key_seed(''cond'',
    r, t, j)) -> randn_like(x0), randn(n,d_y), 5x randn_like) is reproduced by pre-drawing with a torch.Generator
    and feeding a sampler that takes the noise (systems/runners.py::cm_sample_with_noise). M separate MMDs afterwards,
